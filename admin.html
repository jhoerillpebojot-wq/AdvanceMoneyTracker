<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FinLed Admin</title>
<link rel="icon" type="image/png" href="Photos/favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(fonts/IBMPlexSans-Regular.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:500;src:url(fonts/IBMPlexSans-Medium.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:600;src:url(fonts/IBMPlexSans-SemiBold.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(fonts/IBMPlexMono-Regular.woff2) format('woff2');font-display:swap}
:root{--bg:#17140F;--s1:#211D16;--s2:#2A251C;--bd:#3B3528;--bd2:#7A705A;--tx:#F4ECDC;--mu:#B8AE95;--ac:#86C9A0;--on:#10241A;--red:#F28B82;--amb:#E8B04A;--blu:#8DB4EA;--focus:#F0B83A}
@media(prefers-color-scheme:light){:root{--bg:#F3EDE0;--s1:#FBF7EE;--s2:#EFE8D8;--bd:#D8CDB4;--bd2:#8C8168;--tx:#1D1A14;--mu:#5B5343;--ac:#1F5C46;--on:#FAF4E6;--red:#A93226;--amb:#8A5A00;--blu:#2A5C9A;--focus:#8A5A00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'IBM Plex Sans',system-ui,sans-serif}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;word-break:break-all}
h1,h2{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{min-height:48px;padding:0 16px;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
.btn.bad{color:var(--red);border-color:var(--red);background:none}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in{width:100%;min-height:48px;padding:0 12px;background:var(--s2);border:1px solid var(--bd2);border-radius:8px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
#login{max-width:380px;margin:12vh auto 0;padding:16px}
#login .in{margin-bottom:4px}
.top{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--s1)}
.top b{flex:1;display:flex;align-items:center;gap:10px}.top img{width:28px;height:28px}
.who{color:var(--mu);font-size:14px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:16px 0;overflow-x:auto}
.tab{min-height:48px;padding:0 16px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--tx);border-bottom-color:var(--ac);font-weight:500}
.cnt{background:var(--amb);color:#17140F;border-radius:99px;font-size:12px;padding:1px 8px;margin-left:6px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:12px}
.stat span{display:block;font-size:13px;color:var(--mu)}.stat b{font-size:22px;font-weight:600}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar .in{flex:1;min-width:200px}.bar select{width:auto}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:13px;font-weight:500;color:var(--mu)}tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover{background:var(--s2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border:1px solid var(--bd2);border-radius:99px;color:var(--mu)}
.tag.pro{color:var(--ac);border-color:var(--ac)}.tag.plus{color:var(--blu);border-color:var(--blu)}
.tag.pending{color:var(--amb);border-color:var(--amb)}.tag.rejected{color:var(--red);border-color:var(--red)}.tag.approved{color:var(--ac);border-color:var(--ac)}
.mu{color:var(--mu);font-size:14px}.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;overflow-y:auto}
.ov.on{display:flex}
.dlg{background:var(--s1);border:1px solid var(--bd2);border-radius:10px;width:100%;max-width:480px;padding:20px;max-height:92vh;overflow-y:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}.kv span:first-child{color:var(--mu)}.kv span:last-child{text-align:right}
.err{color:var(--red);min-height:22px;font-size:14px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd2);padding:12px 16px;border-radius:8px;display:none;z-index:20;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="login">
  <h1>FinLed Admin</h1>
  <p class="mu">Sign in with an account listed in the admins table.</p>
  <form id="lf">
    <label for="em">Email</label><input class="in" id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="le" role="alert"></div>
    <button class="btn pri" style="width:100%" id="lb">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <b><img src="Photos/favicon-32.png" alt="">FinLed Admin</b>
    <span class="who" id="me"></span>
    <button class="btn sm" id="rf">Refresh</button>
    <button class="btn sm" id="so">Sign out</button>
  </div>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
const sb = window.supabase.createClient("https://smvjaorjuonxdplgmjdr.supabase.co","sb_publishable_wBreCHA84TltwADdmPhN7w_CV0IpZJj",{auth:{persistSession:true,storageKey:'finled-admin-auth'}});
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd = v => v ? new Date(v).toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}) : '-';
const fdt = v => v ? new Date(v).toLocaleString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}) : '-';
let users=[], claims=[], actions=[], tab='claims', cFilter='pending', q='';
const TABS=[['claims','Payments'],['users','Users'],['log','Activity']];

/* same rule as the app's eff(): what plan does this row give right now */
function eff(u){const n=Date.now(),pe=u.current_period_end?Date.parse(u.current_period_end):0,te=u.trial_end?Date.parse(u.trial_end):0;
  if(u.status==='trialing'&&te>n)return{plan:'pro',why:'trial',end:u.trial_end};
  if(['active','canceled','past_due'].includes(u.status)&&pe>n&&(u.plan==='plus'||u.plan==='pro'))return{plan:u.plan,why:u.status==='active'?'paid':u.status,end:u.current_period_end};
  return{plan:'free',why:'',end:null}}
const tagP = p => `<span class="tag ${p}">${p==='free'?'Free':p==='plus'?'Plus':'Pro'}</span>`;
let tt; function toast(m,bad){const t=$('toast');t.textContent=m;t.style.borderColor=bad?'var(--red)':'var(--bd2)';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4000)}
const msg = e => /not allowed/i.test(e.message)?'This account is not an admin.':/already reviewed/i.test(e.message)?'That payment was already reviewed. Refresh.':/violates check/i.test(e.message)?"The claims table does not allow this status. See the note in admin-setup.sql.":(e.message||'Something went wrong.');
async function rpc(fn,args){const r=await sb.rpc(fn,args);if(r.error)throw r.error;return r.data}

/* ---------- auth ---------- */
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';$('lb').disabled=true;
  const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  $('lb').disabled=false;if(r.error)$('le').textContent=r.error.message};
$('so').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>boot(s),0)});
async function boot(s){
  if(!s){$('login').hidden=false;$('app').hidden=true;$('pw').value='';return}
  try{ if(!(await rpc('is_admin')))throw new Error('This account is not an admin.');
    $('me').textContent=s.user.email||'';$('login').hidden=true;$('app').hidden=false;await load();
  }catch(e){$('le').textContent=msg(e);$('login').hidden=false;$('app').hidden=true;sb.auth.signOut()}}
async function load(){
  [users,claims,actions]=await Promise.all([rpc('admin_list_users'),rpc('admin_list_claims',{p_status:null}),rpc('admin_list_actions')]);
  render()}
$('rf').onclick=async()=>{try{await load();toast('Refreshed')}catch(e){toast(msg(e),1)}};

/* ---------- render ---------- */
function render(){
  const act=users.map(eff), wk=Date.now()-7*864e5, pend=claims.filter(c=>c.status==='pending').length;
  $('stats').innerHTML=[['Pending payments',pend],['Users',users.length],['Plus active',act.filter(a=>a.plan==='plus').length],
    ['Pro paid',act.filter(a=>a.plan==='pro'&&a.why!=='trial').length],['On trial',act.filter(a=>a.why==='trial').length],
    ['New this week',users.filter(u=>Date.parse(u.created_at)>wk).length]].map(([l,v])=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-t="${k}">${l}${k==='claims'&&pend?`<span class="cnt">${pend}</span>`:''}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('view').innerHTML=tab==='claims'?claimsView():tab==='users'?usersView():logView();
  if(tab==='claims'){$('cf').onchange=e=>{cFilter=e.target.value;render()};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>reviewDlg(+b.dataset.c))}
  if(tab==='users'){const s=$('uq');s.oninput=e=>{q=e.target.value;$('ub').innerHTML=userRows()};$('ub').onclick=rowClick}}

function claimsView(){
  const L=claims.filter(c=>cFilter==='all'||c.status===cFilter);
  return `<div class="bar"><select class="in" id="cf" aria-label="Filter">${['pending','approved','rejected','all'].map(v=>`<option value="${v}"${v===cFilter?' selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div>
  <div class="panel">${L.length?`<table><thead><tr><th>Submitted</th><th>User</th><th>Plan</th><th>Amount</th><th>GCash reference</th><th>Status</th><th></th></tr></thead><tbody>${L.map(c=>`<tr>
   <td>${fdt(c.created_at)}</td><td>${esc(c.email||c.user_id)}</td><td>${tagP(c.tier)}</td><td>${c.amount_php!=null?'PHP '+esc(c.amount_php):'-'}</td>
   <td class="mono">${esc(c.reference)}${c.payer_name?`<div class="mu">${esc(c.payer_name)}</div>`:''}</td><td><span class="tag ${esc(c.status)}">${esc(c.status)}</span>${c.note?`<div class="mu">${esc(c.note)}</div>`:''}</td>
   <td>${c.status==='pending'?`<button class="btn sm pri" data-c="${c.id}">Review</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No payments here.</div>'}</div>`}

function userRows(){
  const s=q.trim().toLowerCase();
  const L=users.filter(u=>!s||[u.email,u.username,u.id].some(v=>String(v||'').toLowerCase().includes(s)));
  return L.length?L.map(u=>{const e=eff(u);return `<tr class="click" data-u="${u.id}" tabindex="0"><td>${esc(u.email||(u.is_anonymous?'(guest)':'(no email)'))}<div class="mu">${esc(u.username||'')}</div></td>
   <td>${tagP(e.plan)} ${e.why?`<span class="mu">${e.why}</span>`:''}</td><td>${fd(e.end)}</td><td>${fd(u.created_at)}</td><td>${fd(u.last_sign_in_at)}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">No users match.</td></tr>'}
function usersView(){return `<div class="bar"><input class="in" id="uq" type="search" placeholder="Search email, username or ID" value="${esc(q)}" aria-label="Search users"></div>
  <div class="panel"><table><thead><tr><th>User</th><th>Plan</th><th>Plan ends</th><th>Joined</th><th>Last sign-in</th></tr></thead><tbody id="ub">${userRows()}</tbody></table></div>
  <p class="mu">Accounts and plans only. Balances and entries are not shown, matching the privacy policy.</p>`}
function rowClick(e){const r=e.target.closest('[data-u]');if(r)userDlg(r.dataset.u)}
function logView(){return `<div class="panel">${actions.length?`<table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>User</th><th>Detail</th></tr></thead><tbody>${actions.map(a=>`<tr><td>${fdt(a.created_at)}</td><td>${esc(a.admin)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No admin actions yet.</div>'}</div>`}

/* ---------- dialogs ---------- */
function open(h){$('dlg').innerHTML=h;$('ov').classList.add('on');const x=$('dx');if(x)x.onclick=close}
function close(){$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target===$('ov'))close()};
document.onkeydown=e=>{if(e.key==='Escape')close()};
async function run(btn,fn,ok){btn.disabled=true;$('de').textContent='';try{await fn();close();await load();toast(ok)}catch(e){$('de').textContent=msg(e);btn.disabled=false}}

function reviewDlg(id){const c=claims.find(x=>x.id==id);if(!c)return;
  open(`<h2>Review payment</h2>
  <div class="kv"><span>User</span><span>${esc(c.email||c.user_id)}</span></div>
  <div class="kv"><span>Plan paid for</span><span>${tagP(c.tier)}</span></div>
  <div class="kv"><span>Amount claimed</span><span>${c.amount_php!=null?'PHP '+esc(c.amount_php):'-'}</span></div>
  <div class="kv"><span>Reference</span><span class="mono">${esc(c.reference)}</span></div>
  <p class="mu">Check this reference, amount and sender name in your GCash history first. Approving gives one month (adds a month if the same plan is still active).</p>
  <label for="dn">Note to user (shown if rejected)</label><input class="in" id="dn" maxlength="140">
  <div class="err" id="de" role="alert"></div>
  <div class="row"><button class="btn pri" id="ap">Approve and grant</button><button class="btn bad" id="rj">Reject</button><button class="btn" id="dx">Cancel</button></div>`);
  $('ap').onclick=e=>run(e.target,()=>rpc('admin_approve_claim',{p_claim:c.id}),'Approved. Plan granted.');
  $('rj').onclick=e=>run(e.target,()=>rpc('admin_reject_claim',{p_claim:c.id,p_note:$('dn').value.trim()||null}),'Rejected.')}

function userDlg(id){const u=users.find(x=>x.id===id);if(!u)return;const e=eff(u),mine=claims.filter(c=>c.user_id===id).slice(0,3);
  open(`<h2>${esc(u.email||'Guest account')}</h2>
  <div class="kv"><span>Username</span><span>${esc(u.username||'-')}</span></div>
  <div class="kv"><span>User ID</span><span class="mono">${esc(u.id)}</span></div>
  <div class="kv"><span>Joined</span><span>${fd(u.created_at)}</span></div>
  <div class="kv"><span>Current plan</span><span>${tagP(e.plan)} ${e.why||''}${e.end?' until '+fd(e.end):''}</span></div>
  ${mine.length?`<div class="kv"><span>Recent payments</span><span>${mine.map(c=>`${esc(c.tier)} <span class="tag ${esc(c.status)}">${esc(c.status)}</span>`).join('<br>')}</span></div>`:''}
  <h2 style="margin-top:20px">Grant plan</h2>
  <div class="row"><div style="flex:1"><label for="gp">Plan</label><select class="in" id="gp"><option value="plus">Plus</option><option value="pro">Pro</option></select></div>
  <div style="flex:1"><label for="gd">Days</label><input class="in" id="gd" type="number" min="1" max="3650" value="30"></div></div>
  <label for="gr">Reason (logged)</label><input class="in" id="gr" maxlength="140" placeholder="e.g. beta tester, refund, cash payment">
  <div class="err" id="de" role="alert"></div>
  <div class="row"><button class="btn pri" id="gg">Grant</button>${e.plan!=='free'?'<button class="btn bad" id="gv">Revoke plan</button>':''}<button class="btn" id="dx">Close</button></div>`);
  $('gg').onclick=b=>run(b.target,()=>rpc('admin_grant',{p_user:id,p_plan:$('gp').value,p_days:+$('gd').value,p_reason:$('gr').value.trim()||null}),'Plan granted.');
  if($('gv'))$('gv').onclick=b=>{if(confirm('Revoke this user\'s plan now?'))run(b.target,()=>rpc('admin_revoke',{p_user:id,p_reason:$('gr').value.trim()||null}),'Plan revoked.')}}

sb.auth.getSession().then(r=>boot(r.data.session));
</script>
</body>
</html>
